[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "dspm-memory"
version     = "0.2.1"
description = "Dynamic Semantic Patch Memory - token-budget compression for long-context LLM conversations with universal CRR=100% guarantee"
readme      = "README.md"
license     = { text = "MIT" }
authors     = [{ name = "Dhruv Dubey", email = "dhruvdubey1311@gmail.com" }]
keywords    = ["llm", "memory", "compression", "context", "nlp", "ai", "crr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "groq>=0.4.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.0.0",
    "tiktoken>=0.5.0",
    "spacy>=3.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.urls]
Homepage      = "https://dspm-nine.vercel.app"
Repository    = "https://github.com/zatchbell1311-wq/Kernl"
Documentation = "https://github.com/zatchbell1311-wq/Kernl#readme"
Paper         = "https://doi.org/10.5281/zenodo.19438636"

[tool.setuptools.packages.find]
where = ["."]
include = ["dspm*"]


